# ============================================
# 🔴 MarsBoard - Nginx Configuration
# ============================================
# Dominio: marsboard.iotsoluciones.cloud
#   - Frontend (Next.js)      → http://127.0.0.1:3000
#   - Backend (Express API)   → http://127.0.0.1:4000
#
# Instalación en el VPS:
#   sudo cp nginx-marsboard.conf /etc/nginx/sites-available/marsboard
#   sudo ln -sf /etc/nginx/sites-available/marsboard /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d marsboard.iotsoluciones.cloud
#   sudo nginx -t && sudo systemctl reload nginx

# ─── REDIRECT HTTP → HTTPS ───
server {
    listen 80;
    server_name marsboard.iotsoluciones.cloud;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS SERVER ───
server {
    listen 443 ssl http2;
    server_name marsboard.iotsoluciones.cloud;

    # SSL - Certbot gestiona estas rutas automáticamente
    ssl_certificate /etc/letsencrypt/live/marsboard.iotsoluciones.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marsboard.iotsoluciones.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Optimización Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml font/woff2;

    # 1. Backend Express API (/api/*)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 60s;
        client_max_body_size 25M;
    }

    # 2. Health check endpoint del backend
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Frontend Next.js (Dashboard y SSR/Client)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
