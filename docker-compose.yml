services:
  marsboard-backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: marsboard-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=${PORT:-4000}
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-https://marsboard.iotsoluciones.cloud}
      - NASA_API_KEY=${NASA_API_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - marsboard-cache:/app/src/data/cache

  marsboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: marsboard-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - marsboard-backend

volumes:
  marsboard-cache:
